<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Suma de dos numeros</title>
    <link rel="stylesheet" href="ejercicio1.css">
</head>
<body>
    <h1>Ejercicio 1 - Suma de dos numeros</h1>
    <p><strong>Enunciado:</strong> Crear una pagina HTML que permita sumar dos numeros definidos en el codigo JavaScript embebido. El resultado debe mostrarse dentro de la pagina.</p>
    <div id="resultado"></div>

    <script>
        let num1 = 15;
        let num2 = 8;
        let suma = num1 + num2;
        document.getElementById("resultado").innerHTML = "La suma de " + num1 + " + " + num2 + " es: " + suma;
    </script>

    <p><a href="index.html">Volver al menu</a></p>
</body>
</html>
